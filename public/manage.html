<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title>Nastavení upozornění · Dejnyho Hlídač</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <script>
    (function () {
      var t = 'light';
      try { if (localStorage.getItem('theme') === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="wordmark" href="/">Dejnyho Hlídač</a>
    </div>
  </header>
  <main class="wrap page manage">
    <section class="section" aria-labelledby="m-title">
      <div class="section-bar"><h1 id="m-title" class="section-title">Nastavení upozornění</h1></div>
      <p class="lead" id="m-lead">Načítám odběr…</p>
      <div id="m-form" hidden>
        <fieldset class="choice">
          <legend>Stanice</legend>
          <label class="tog tog-ono"><input type="checkbox" name="stations" value="tank-ono" /><span>Tank ONO Teplice</span></label>
          <label class="tog tog-makro"><input type="checkbox" name="stations" value="makro" /><span>Makro Trmice</span></label>
        </fieldset>
        <fieldset class="choice">
          <legend>Palivo</legend>
          <label class="tog"><input type="checkbox" name="fuels" value="natural95" /><span>Natural 95</span></label>
          <label class="tog"><input type="checkbox" name="fuels" value="diesel" /><span>Nafta</span></label>
        </fieldset>
        <div class="manage-actions">
          <button type="button" class="btn btn-ink" id="m-save">Uložit</button>
          <button type="button" class="btn btn-danger" id="m-unsub">Odhlásit odběr</button>
        </div>
      </div>
      <p class="msg" id="m-msg" role="status"></p>
    </section>
    <p class="back"><a href="/">Zpět na ceny</a></p>
  </main>
  <script>
  (() => {
    const token = new URLSearchParams(location.search).get('token') || '';
    const $ = (s) => document.querySelector(s);
    const msg = (t, k) => { $('#m-msg').className = 'msg' + (k ? ' ' + k : ''); $('#m-msg').textContent = t; };
    const pick = (n) => [...document.querySelectorAll('input[name="' + n + '"]:checked')].map((i) => i.value);
    const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });

    fetch('/api/subscription?token=' + encodeURIComponent(token)).then(async (r) => {
      if (!r.ok) { $('#m-lead').textContent = 'Tenhle odkaz nepatří k žádnému odběru. Možná už je odhlášený.'; return; }
      const s = await r.json();
      $('#m-lead').textContent = '';
      $('#m-lead').append('Odběr pro ', Object.assign(document.createElement('span'), { className: 'manage-email', textContent: s.email }), '.');
      document.querySelectorAll('input[name="stations"]').forEach((i) => { i.checked = s.stations.includes(i.value); });
      document.querySelectorAll('input[name="fuels"]').forEach((i) => { i.checked = s.fuels.includes(i.value); });
      $('#m-form').hidden = false;
    }).catch(() => { $('#m-lead').textContent = 'Odběr se nepodařilo načíst. Zkus stránku obnovit.'; });

    $('#m-save').addEventListener('click', async () => {
      const body = { token, stations: pick('stations'), fuels: pick('fuels') };
      if (!body.stations.length || !body.fuels.length) return msg('Vyber aspoň jednu stanici a jedno palivo.', 'err');
      const r = await post('/api/subscription', body).catch(() => null);
      msg(r && r.ok ? 'Uloženo.' : 'Uložení se nepovedlo. Zkus to znovu.', r && r.ok ? 'ok' : 'err');
    });
    $('#m-unsub').addEventListener('click', async () => {
      const r = await post('/api/unsubscribe', { token }).catch(() => null);
      if (r && r.ok) { $('#m-form').hidden = true; $('#m-lead').textContent = 'Odhlášeno. Další e-maily už nepřijdou.'; msg(''); }
      else msg('Odhlášení se nepovedlo. Zkus to znovu.', 'err');
    });
  })();
  </script>
</body>
</html>
